server {

    listen 80;

    # Docker service IPs change when containers are recreated. Resolve the
    # service name for each request instead of retaining the startup-time IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream web:8000;

    # set this to 100GB to allow upload of large files
    client_max_body_size 100G;

    location / {
        proxy_pass http://$web_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;        
    }

    location /static/ {
        alias /home/app/web/static/;
    }

    location /media/ {
        alias /home/app/web/media/;
	    add_header Access-Control-Allow-Origin *;
    }

    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
}
