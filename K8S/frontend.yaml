apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: misland-africa
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.2.53
  selector: {app: misland-frontend}
  ports:
    - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: misland-africa
spec:
  replicas: 1
  selector:
    matchLabels: {app: misland-frontend}
  template:
    metadata:
      labels: {app: misland-frontend}
    spec:
      nodeSelector: {kubernetes.io/hostname: worker-prod-01}
      containers:
        - name: frontend
          image: mehdino123/misland-frontend:k8s-v1
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: frontend.conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: misland-nginx-config}
