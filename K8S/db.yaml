apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: misland-africa
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 30Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: misland-africa
spec:
  selector: {app: misland-db}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: misland-africa
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: misland-db}
  template:
    metadata:
      labels: {app: misland-db}
    spec:
      nodeSelector: {kubernetes.io/hostname: worker-prod-01}
      containers:
        - name: postgres
          image: kartoza/postgis:9.6-2.4
          args: ["postgres", "-c", "max_connections=1000"]
          envFrom:
            - configMapRef: {name: misland-config}
            - secretRef: {name: misland-secrets}
          env:
            - {name: ALLOW_IP_RANGE, value: "10.244.0.0/16"}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [sh, -c, 'PGPASSWORD="$POSTGRES_PASS" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DBNAME" -c "SELECT 1"']
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
